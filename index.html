<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>generador de horario</title>
    <link href="css/style.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </head>
  <body>
    <header class="top-nav">
    <div id="modal-overlay" class="overlay"></div>
      <div style="display: flex; align-items: center; gap: 1rem">
        <button id="btn-menu-toggle" class="hamburger-btn">
          <svg
            viewBox="0 0 24 24"
            width="24"
            height="24"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <h1>Estructura de Cursos</h1>
      </div>
      <div class="controls">
        <button id="btn-export-img" title="exportar como imagen">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
        <button id="btn-export-url" class="success">
          <span class="desktop-btn">Compartir Horario</span
          ><span class="mobile-btn">Compartir</span>
        </button>
        <button id="btn-export-ics">
          <span class="desktop-btn">Exportar a Google Calendar (.ics)</span
          ><span class="mobile-btn">Exportar</span>
        </button>
        <button id="btn-theme-toggle" title="cambiar tema">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="search-container">
          <input
            type="text"
            id="search-input"
            placeholder="buscar curso (ej: sw603)..."
          />
          <div id="search-results" class="results-box"></div>
        </div>

        <div class="cart-container">
          <h3>Cursos en Horario</h3>
          <!-- <h3>Cursos en Horario (<span id="credit-counter">0</span> cred)</h3> -->
          <div id="selected-courses-list"></div>
        </div>

        <!-- <div class="optimizer-trigger">
          <button
            id="btn-open-optimizer"
            style="width: 100%; background: #6f42c1; color: white"
          >
            Autogenerador de Horario Ideal
          </button>
        </div> -->
      </aside>

      <section class="schedule-container">
        <div id="calendar-grid" class="calendar">
          <div class="grid-header time-col">hora</div>
          <div class="grid-header">
            <span class="desktop-day">lunes</span
            ><span class="mobile-day">l</span>
          </div>
          <div class="grid-header">
            <span class="desktop-day">martes</span
            ><span class="mobile-day">m</span>
          </div>
          <div class="grid-header">
            <span class="desktop-day">miercoles</span
            ><span class="mobile-day">x</span>
          </div>
          <div class="grid-header">
            <span class="desktop-day">jueves</span
            ><span class="mobile-day">j</span>
          </div>
          <div class="grid-header">
            <span class="desktop-day">viernes</span
            ><span class="mobile-day">v</span>
          </div>
          <div class="grid-header">
            <span class="desktop-day">sábado</span
            ><span class="mobile-day">s</span>
          </div>
        </div>
      </section>
    </main>

    <dialog id="section-modal" class="popup">
      <h3 id="modal-title"></h3>
      <div id="modal-sections-list"></div>
      <div
        class="modal-actions"
        style="margin-top: 15px; display: flex; gap: 10px"
      >
        <button id="btn-add-section" class="success">Añadir al Horario</button>
        <button id="btn-close-modal" style="background: var(--border-grid)">
          Cancelar
        </button>
      </div>
    </dialog>

    <div id="notification-toast" class="toast"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
